<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BDRIS Sub Admin</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#17202a}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d9e2ec;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 6px 22px #0000000b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}input{padding:11px;border:1px solid #cbd5df;border-radius:8px}button{padding:10px 13px;border:0;border-radius:8px;font-weight:700;cursor:pointer}.green{background:#25a85a;color:white}.blue{background:#1769aa;color:white}.gray{background:#53606d;color:white}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #e7edf2}.meta{font-size:12px;color:#66727d}.login{max-width:400px;margin:70px auto}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{flex-direction:column}}</style></head><body><div class="wrap"><div id="login" class="card login"><h2>🔐 Sub Admin Login</h2><input id="u" placeholder="Username" style="width:100%;box-sizing:border-box"><br><br><input id="p" type="password" placeholder="Password" style="width:100%;box-sizing:border-box"><br><br><button class="blue" style="width:100%" onclick="login()">LOGIN</button><p id="msg"></p></div><div id="app" style="display:none"><div class="card"><h2>Sub Admin Dashboard</h2><div id="info"></div></div><div class="card"><h3>Create Customer</h3><div class="grid"><input id="n" placeholder="Customer name"><input id="cu" placeholder="Username"><input id="cp" type="password" placeholder="Password"><input id="cr" type="number" step="0.01" placeholder="Rate"></div><br><button class="green" onclick="createCustomer()">Create Customer</button><button class="gray" onclick="logout()" style="float:right">Logout</button></div><div class="card"><h3>My Customers</h3><div id="customers">Loading…</div></div></div></div><script>let token=localStorage.getItem('BDRIS_SUBADMIN_TOKEN')||'';const $=x=>document.getElementById(x);async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function deviceId(){let x=localStorage.getItem('BDRIS_DEVICE_ID_V1');if(!x){x='dev-'+crypto.randomUUID();localStorage.setItem('BDRIS_DEVICE_ID_V1',x)}return x}async function login(){try{const r=await fetch('/api/auth/subadmin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value,deviceId:deviceId()})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Login failed');token=d.token;localStorage.setItem('BDRIS_SUBADMIN_TOKEN',token);show()}catch(e){$('msg').textContent=e.message}}async function show(){try{const d=await api('/api/subadmin/me');$('login').style.display='none';$('app').style.display='block';$('info').textContent='Base rate: ৳'+d.baseRate+' • Your rate: ৳'+d.user.rate;load()}catch(e){logout()}}async function load(){const d=await api('/api/subadmin/customers');$('customers').innerHTML=d.customers.length?d.customers.map(c=>`<div class="row"><div><b>${esc(c.name||c.username)}</b><div class="meta">${esc(c.username)} • Balance ৳${Number(c.balance||0)} • Rate ৳${Number(c.rate||4)}</div></div><div><button class="blue" onclick="setRate('${c.id}',${Number(c.rate||4)})">Rate</button> <button class="green" onclick="add('${c.id}')">+ Balance</button></div></div>`).join(''):'No customers'}async function createCustomer(){try{const d=await api('/api/subadmin/customers',{method:'POST',body:JSON.stringify({name:$('n').value,username:$('cu').value,password:$('cp').value,rate:Number($('cr').value)||undefined})});$('msg').textContent='Customer created: '+d.user.username;$('n').value=$('cu').value=$('cp').value=$('cr').value='';load()}catch(e){alert(e.message)}}async function setRate(id,current){const v=prompt('Customer rate:',String(current));if(v===null)return;await api('/api/subadmin/customers/'+id,{method:'PATCH',body:JSON.stringify({setRate:Number(v)})});load()}async function add(id){const v=prompt('Balance যোগ করুন:','100');if(v===null)return;await api('/api/subadmin/customers/'+id,{method:'PATCH',body:JSON.stringify({addBalance:Number(v)})});load()}function logout(){localStorage.removeItem('BDRIS_SUBADMIN_TOKEN');location.reload()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}if(token)show();</script></body></html>
