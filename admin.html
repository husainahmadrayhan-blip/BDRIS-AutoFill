<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BDRIS Admin Control</title><style>body{margin:0;font-family:Arial,sans-serif;background:#050a0f;color:#eaf7e5}.wrap{max-width:1150px;margin:24px auto;padding:18px}.card{background:#0b131b;border:1px solid #31502c;border-radius:16px;padding:20px;box-shadow:0 0 30px #65ff3c12;margin-bottom:16px}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}input{width:100%;padding:11px;border-radius:9px;border:1px solid #33434e;background:#111b24;color:#fff;box-sizing:border-box}button{padding:10px 13px;border:0;border-radius:8px;cursor:pointer;font-weight:700}.green{background:#69d94b;color:#071007}.red{background:#d9534f;color:#fff}.gray{background:#34414b;color:#fff}.blue{background:#2868a8;color:#fff}.msg{margin:10px 0;color:#82ec62}.login{max-width:420px;margin:70px auto}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #20303a}.meta{font-size:12px;color:#89978f;word-break:break-all;margin-top:3px}.actions{display:flex;gap:6px;flex-wrap:wrap}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#17331b;border:1px solid #315f36;font-size:10px;color:#91ef7b}.commission{font-size:20px;font-weight:800;color:#9df081}@media(max-width:760px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}}</style></head><body><div class="wrap"><div id="login" class="card login"><h1>🔐 Admin Login</h1><p>BDRIS User Control</p><input id="au" placeholder="Admin username"><br><br><input id="ap" type="password" placeholder="Admin password"><br><br><button class="green" style="width:100%" onclick="adminLogin()">LOGIN</button><div id="lm" class="msg"></div></div><div id="panel" style="display:none"><div class="card"><h1>BDRIS Admin Control</h1><div id="msg" class="msg"></div><div class="grid"><input id="name" placeholder="Customer name"><input id="user" placeholder="Username"><input id="pass" placeholder="Password" type="password"></div><br><button class="green" onclick="createUser()">+ Create Customer</button><button class="blue" onclick="showSubForm()">+ Create Sub Admin</button><button class="gray" onclick="logout()" style="float:right">Logout</button></div><div id="subForm" class="card" style="display:none"><h2>Create Sub Admin</h2><div class="grid"><input id="sname" placeholder="Sub Admin name"><input id="suser" placeholder="Username"><input id="spass" type="password" placeholder="Password"></div><br><button class="blue" onclick="createSubAdmin()">Create Sub Admin</button><button class="gray" onclick="$('subForm').style.display='none'">Cancel</button></div><div class="card"><h2>Users / Customers</h2><div id="users">Loading…</div></div><div class="card"><h2>Sub Admin Commission</h2><div id="commissions">Loading…</div></div></div></div><script>const PUBLIC_ORIGIN=location.origin;const API_BASE=(location.protocol==='file:'?'http://localhost:3000':'');function apiUrl(p){return API_BASE+p}let token=localStorage.getItem('BDRIS_ADMIN_TOKEN')||'';const $=id=>document.getElementById(id);async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(apiUrl(url),opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function adminLogin(){try{$('lm').textContent='Logging in…';const r=await fetch(apiUrl('/api/auth/admin-login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('au').value,password:$('ap').value})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Login failed');token=d.token;localStorage.setItem('BDRIS_ADMIN_TOKEN',token);await showPanel()}catch(e){$('lm').textContent=e.message}}async function showPanel(){try{await api('/api/auth/me');$('login').style.display='none';$('panel').style.display='block';await Promise.all([loadUsers(),loadCommissions()])}catch(e){token='';localStorage.removeItem('BDRIS_ADMIN_TOKEN');$('panel').style.display='none';$('login').style.display='block';$('lm').textContent=e.message}}function showSubForm(){$('subForm').style.display='block'}async function createSubAdmin(){try{const d=await api('/api/admin/subadmins',{method:'POST',body:JSON.stringify({name:$('sname').value.trim(),username:$('suser').value.trim(),password:$('spass').value})});$('msg').textContent='Sub Admin তৈরি হয়েছে: '+d.user.username;$('sname').value=$('suser').value=$('spass').value='';$('subForm').style.display='none';loadUsers();loadCommissions()}catch(e){$('msg').textContent=e.message}}async function createUser(){try{const d=await api('/api/admin/users',{method:'POST',body:JSON.stringify({name:$('name').value.trim(),username:$('user').value.trim(),password:$('pass').value})});$('msg').textContent='Customer তৈরি হয়েছে। Link: '+PUBLIC_ORIGIN+'/'+d.link;navigator.clipboard?.writeText(PUBLIC_ORIGIN+'/'+d.link).catch(()=>{});$('name').value=$('user').value=$('pass').value='';loadUsers()}catch(e){$('msg').textContent=e.message}}async function loadUsers(){try{const d=await api('/api/admin/users');$('users').innerHTML=d.users.length?d.users.map(u=>`<div class="row"><div><b>${esc(u.name||u.username)}</b> <span class="pill">${esc(u.role||'customer')}</span><div class="meta">Username: ${esc(u.username)} • ${u.enabled?'Enabled':'Disabled'} • Device: ${u.deviceId?'Bound':'Not bound'} • Balance: ৳${Number(u.balance||0)} • Rate: ৳${Number(u.rate||4)}</div><div class="meta">${u.role==='subadmin'?'Customers: '+d.users.filter(x=>x.parentId===u.id).length:esc(PUBLIC_ORIGIN+'/?access='+encodeURIComponent(u.accessToken)+'&uid='+encodeURIComponent(u.id)+'&auth='+encodeURIComponent(u.auth||''))}</div></div><div class="actions"><button class="gray" onclick="toggleUser('${u.id}',${!u.enabled})">${u.enabled?'Disable':'Enable'}</button><button class="green" onclick="addBalance('${u.id}')">+ Balance</button><button class="gray" onclick="setBalance('${u.id}')">Set Balance</button>${u.role==='customer'?`<button class="blue" onclick="setRate('${u.id}',${Number(u.rate||4)})">Set Rate</button>`:''}<button class="gray" onclick="resetDevice('${u.id}')">Reset Device</button><button class="red" onclick="deleteUser('${u.id}')">Delete</button></div></div>`).join(''):'No users'}catch(e){$('users').textContent=e.message}}async function loadCommissions(){try{const d=await api('/api/admin/commissions');$('commissions').innerHTML=d.subadmins.length?d.subadmins.map(x=>`<div class="row"><div><b>${esc(x.name||x.username)}</b><div class="meta">${esc(x.username)} • Customers: ${x.customers}</div></div><div class="commission">৳${Number(x.commission||0).toFixed(2)}</div></div>`).join(''):'No Sub Admin'}catch(e){$('commissions').textContent=e.message}}async function toggleUser(id,enabled){await api('/api/admin/users/'+id,{method:'PATCH',body:JSON.stringify({enabled})});loadUsers()}async function addBalance(id){const v=prompt('কত টাকা যোগ করবেন?','100');if(v===null)return;const n=Number(v);if(!Number.isFinite(n))return alert('সঠিক amount দিন');await api('/api/admin/users/'+id,{method:'PATCH',body:JSON.stringify({addBalance:n})});loadUsers()}async function setBalance(id){const v=prompt('নতুন Balance কত হবে?','0');if(v===null)return;const n=Number(v);if(!Number.isFinite(n)||n<0)return alert('সঠিক amount দিন');await api('/api/admin/users/'+id,{method:'PATCH',body:JSON.stringify({setBalance:n})});loadUsers()}async function setRate(id,current){const v=prompt('Customer rate (base-এর নিচে নয়):',String(current||4));if(v===null)return;const n=Number(v);if(!Number.isFinite(n))return alert('সঠিক rate দিন');await api('/api/admin/users/'+id,{method:'PATCH',body:JSON.stringify({setRate:n})});loadUsers();loadCommissions()}async function resetDevice(id){await api('/api/admin/users/'+id,{method:'PATCH',body:JSON.stringify({resetDevice:true})});loadUsers()}async function deleteUser(id){if(!confirm('Delete this user?'))return;await api('/api/admin/users/'+id,{method:'DELETE'});loadUsers();loadCommissions()}function logout(){localStorage.removeItem('BDRIS_ADMIN_TOKEN');location.reload()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}if(token)showPanel();</script></body></html>
