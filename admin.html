<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BDRIS Admin Control</title><style>body{margin:0;font-family:Arial,sans-serif;background:#050a0f;color:#eaf7e5}.wrap{max-width:1180px;margin:20px auto;padding:14px}.card{background:#0b131b;border:1px solid #31502c;border-radius:16px;padding:18px;box-shadow:0 0 30px #65ff3c12;margin-bottom:15px}h1,h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}input{width:100%;padding:11px;border-radius:9px;border:1px solid #33434e;background:#111b24;color:#fff;box-sizing:border-box}button{padding:9px 12px;border:0;border-radius:8px;cursor:pointer;font-weight:700}.green{background:#69d94b;color:#071007}.red{background:#d9534f;color:#fff}.gray{background:#34414b;color:#fff}.blue{background:#2563eb;color:#fff}.msg{margin:9px 0;color:#82ec62}.login{max-width:420px;margin:70px auto}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input{flex:1;min-width:240px}.user-card{padding:15px 0;border-bottom:1px solid #20303a}.meta{font-size:12px;color:#9aa8a0;word-break:break-all;margin-top:5px}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#17331b;color:#87ea69;border:1px solid #315f36;font-size:11px}.actions,.rate-box{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.rate-box input{width:110px}.edit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.history{margin-top:10px;padding:10px;border-radius:10px;background:#071016;display:none;font-size:12px}.history-row{padding:6px 0;border-bottom:1px solid #20303a}@media(max-width:700px){.grid,.edit-grid{grid-template-columns:1fr}.wrap{padding:10px}.actions button,.rate-box button{flex:1}.rate-box input{width:100%}.toolbar input{min-width:0}}
</style></head><body><div class="wrap"><div id="login" class="card login"><h1>🔐 Admin Login</h1><p>BDRIS User Control</p><input id="au" placeholder="Admin username"><br><br><input id="ap" type="password" placeholder="Admin password"><br><br><button class="green" style="width:100%" onclick="adminLogin()">LOGIN</button><div id="lm" class="msg"></div></div><div id="panel" style="display:none"><div class="card"><h1>BDRIS User Control</h1><p class="meta">User, Balance, Preview Rate, Login/Device এবং customer metadata এক জায়গা থেকে পরিচালনা করুন।</p><div id="msg" class="msg"></div><div class="grid"><input id="name" placeholder="User name"><input id="user" placeholder="Username"><input id="pass" placeholder="Password" type="password"></div><br><button class="green" onclick="createUser()">+ Create User</button><button class="gray" onclick="logout()" style="float:right">Logout</button></div><div class="card"><div class="toolbar"><input id="search" placeholder="🔎 নাম / Username / BRT Number / জন্মতারিখ দিয়ে Search" oninput="filterUsers()"><button class="blue" onclick="loadUsers()">Refresh</button></div><div id="users">Loading…</div></div></div></div><script>const PUBLIC_ORIGIN=location.origin;const API_BASE=(location.protocol==='file:'?'http://localhost:3000':'');function apiUrl(p){return API_BASE+p}let token=localStorage.getItem('BDRIS_ADMIN_TOKEN')||'';let allUsers=[];const $=id=>document.getElementById(id);async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(apiUrl(url),opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function adminLogin(){try{$('lm').textContent='Logging in…';const r=await fetch(apiUrl('/api/auth/admin-login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('au').value,password:$('ap').value})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Login failed');token=d.token;localStorage.setItem('BDRIS_ADMIN_TOKEN',token);await showPanel()}catch(e){$('lm').textContent=e.message}}async function showPanel(){try{await api('/api/auth/me');$('login').style.display='none';$('panel').style.display='block';await loadUsers()}catch(e){token='';localStorage.removeItem('BDRIS_ADMIN_TOKEN');$('panel').style.display='block';$('login').style.display='block';$('panel').style.display='none';$('lm').textContent=e.message}}async function createUser(){try{const d=await api('/api/admin/users',{method:'POST',body:JSON.stringify({name:$('name').value.trim(),username:$('user').value.trim(),password:$('pass').value})});const link=PUBLIC_ORIGIN+'/'+d.link;$('msg').textContent='User তৈরি হয়েছে। Link: '+link;navigator.clipboard?.writeText(link).catch(()=>{});$('name').value=$('user').value=$('pass').value='';loadUsers()}catch(e){$('msg').textContent=e.message}}async function loadUsers(){try{const d=await api('/api/admin/users');allUsers=d.users||[];renderUsers(allUsers)}catch(e){$('users').textContent=e.message}}function filterUsers(){const q=$('search').value.trim().toLowerCase();renderUsers(allUsers.filter(u=>!q||[u.name,u.username,u.nameBn,u.nameEn,u.birthRegNo,u.birthDateBn,u.birthDateEn].some(v=>String(v||'').toLowerCase().includes(q))))}function renderUsers(users){$('users').innerHTML=users.length?users.map(u=>{const link=PUBLIC_ORIGIN+'/?access='+encodeURIComponent(u.accessToken)+'&uid='+encodeURIComponent(u.id)+'&auth='+encodeURIComponent(u.auth||'');return `<div class="user-card"><b>${esc(u.name||u.username)}</b><span class="badge">${u.enabled?'Enabled':'Disabled'}</span><div class="meta">Username: ${esc(u.username)} • Balance: ৳${Number(u.balance||0)} • Preview Rate: ৳${Number(u.previewRate??4)} • Device: ${u.deviceId?'Bound':'Not bound'}</div><div class="meta">Last Login: ${u.lastLoginAt?new Date(Number(u.lastLoginAt)).toLocaleString():'Never'}</div><div class="meta">BRT: ${esc(u.birthRegNo||'—')} • DOB BN: ${esc(u.birthDateBn||'—')} • DOB EN: ${esc(u.birthDateEn||'—')}</div><div class="rate-box"><input id="rate-${u.id}" type="number" min="0" step="0.01" value="${Number(u.previewRate??4)}"><button class="blue" onclick="setRate('${u.id}')">Set Preview Rate</button><button class="gray" onclick="copyLink('${escAttr(link)}')">Copy Access Link</button><button class="gray" onclick="toggleHistory('${u.id}')">Balance History</button></div><div class="actions"><button class="gray" onclick="toggleUser('${u.id}',${!u.enabled})">${u.enabled?'Disable':'Enable'}</button><button class="green" onclick="addBalance('${u.id}')">+ Balance</button><button class="gray" onclick="setBalance('${u.id}')">Set Balance</button><button class="gray" onclick="resetDevice('${u.id}')">Reset Device</button><button class="gray" onclick="resetPassword('${u.id}')">Password Reset</button><button class="red" onclick="deleteUser('${u.id}')">Delete</button></div><div class="edit-grid"><input id="nb-${u.id}" placeholder="বাংলা নাম" value="${escAttr(u.nameBn||'')}"><input id="ne-${u.id}" placeholder="English Name" value="${escAttr(u.nameEn||'')}"><input id="br-${u.id}" placeholder="BRT Number" value="${escAttr(u.birthRegNo||'')}"><input id="db-${u.id}" placeholder="জন্ম তারিখ বাংলা" value="${escAttr(u.birthDateBn||'')}"><input id="de-${u.id}" placeholder="Date of Birth English" value="${escAttr(u.birthDateEn||'')}"><button class="blue" onclick="saveMeta('${u.id}')">Save User Data</button></div><div id="hist-${u.id}" class="history"></div></div>`}).join(''):'No users'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(v){return esc(v)}async function setRate(id){const n=Number($('rate-'+id).value);if(!Number.isFinite(n)||n<0)return alert('সঠিক Preview Rate দিন');await api('/api/admin/users/'+id,{method:'PATCH',body:JSON.stringify({setPreviewRate:n})});await loadUsers()}async function saveMeta(id){await api('/api/admin/users/'+id,{method:'PATCH',body:JSON.stringify({nameBn:$('nb-'+id).value,nameEn:$('ne-'+id).value,birthRegNo:$('br-'+id).value,birthDateBn:$('db-'+id).value,birthDateEn:$('de-'+id).value})});await loadUsers()}async function copyLink(link){await navigator.clipboard?.writeText(link).catch(()=>{});$('msg').textContent='Access Link copy হয়েছে।'}async function toggleUser(id,enabled){await api('/api/admin/users/'+id,{method:'PATCH',body:JSON.stringify({enabled})});await loadUsers()}async function addBalance(id){const v=prompt('কত টাকা যোগ করবেন?','100');if(v===null)return;const n=Number(v);if(!Number.isFinite(n))return alert('সঠিক amount দিন');await api('/api/admin/users/'+id,{method:'PATCH',body:JSON.stringify({addBalance:n})});await loadUsers()}async function setBalance(id){const v=prompt('নতুন Balance কত হবে?','0');if(v===null)return;const n=Number(v);if(!Number.isFinite(n)||n<0)return alert('সঠিক amount দিন');await api('/api/admin/users/'+id,{method:'PATCH',body:JSON.stringify({setBalance:n})});await loadUsers()}async function resetDevice(id){await api('/api/admin/users/'+id,{method:'PATCH',body:JSON.stringify({resetDevice:true})});await loadUsers()}async function resetPassword(id){const v=prompt('নতুন Password দিন:');if(v===null||!v)return;await api('/api/admin/users/'+id,{method:'PATCH',body:JSON.stringify({newPassword:v})});alert('Password reset হয়েছে।')}async function toggleHistory(id){const el=$('hist-'+id);if(el.style.display==='block'){el.style.display='none';return}try{const d=await api('/api/admin/users/'+id+'/balance-history');el.innerHTML=d.history.length?d.history.map(h=>`<div class="history-row">${new Date(Number(h.createdAt)).toLocaleString()} • ${esc(h.action)} • Change: ৳${Number(h.change).toFixed(2)} • Balance: ৳${Number(h.balanceAfter).toFixed(2)}</div>`).join(''):'No balance history';el.style.display='block'}catch(e){el.textContent=e.message;el.style.display='block'}}async function deleteUser(id){if(!confirm('Delete this user?'))return;await api('/api/admin/users/'+id,{method:'DELETE'});loadUsers()}function logout(){localStorage.removeItem('BDRIS_ADMIN_TOKEN');location.reload()}if(token)showPanel(); window.addEventListener('focus',()=>{if(token)loadUsers().catch(()=>{})});</script></body></html>
