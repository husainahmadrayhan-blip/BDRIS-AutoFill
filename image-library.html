<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAKE Office Image Library</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;width:100%;max-width:1100px;margin:24px auto;padding:0 14px;background:#f6f7f9;color:#111;overflow-x:hidden}.card{min-width:0;overflow-wrap:anywhere}.preview{display:block;max-width:100%;width:auto;max-height:220px;object-fit:contain;margin:10px 0;border:1px solid #e5e7eb;border-radius:8px;background:#fff}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.toolbar input{flex:1;min-width:180px;max-width:100%;padding:10px;border:1px solid #ccd3dc;border-radius:8px}.muted{color:#666;font-size:13px}@media(max-width:520px){body{margin:10px auto;padding:0 10px}.top{align-items:stretch}.top>div{min-width:0;width:100%}.pos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.pos label,.pos input{width:100%;min-width:0}.card{padding:10px}.toolbar input{width:100%;min-width:0}}.top{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0}.name{font-weight:700}.ok{color:#087f23}.miss{color:#b42318}button,a.btn{padding:8px 12px;margin:6px 4px 0 0;border:0;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}.replace,.save,.export{background:#111;color:#fff}.del{background:#fee4e2;color:#b42318}.small{font-size:13px;color:#666}.pos{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.pos label{font-size:12px}.pos input{width:78px;padding:6px;border:1px solid #ccc;border-radius:6px}</style></head><body><div class="top"><div><h2>MAKE Office Image Library</h2><div class="small">Image + PDF position data/data/pdf-images-এ permanent থাকে। Position Save করার পর Export ZIP দিয়ে backup নিন।</div></div><div><button onclick="load()">Refresh</button><a class="btn export" href="/api/pdf-images/export.zip">Export Permanent ZIP</a></div></div><div class="toolbar"><input id="search" type="search" placeholder="Image name দিয়ে খুঁজুন..." oninput="render()"><span id="count" class="muted"></span></div><div id="list">Loading…</div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(u,o){const r=await fetch(u,o);const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw Error(t.slice(0,160))}if(!r.ok||d.ok===false)throw Error(d.error||'Request failed');return d}
let allImages=[];
function render(){
 const q=String(document.getElementById('search')?.value||'').trim().toLocaleLowerCase();
 const images=allImages.filter(x=>String(x.name||'').toLocaleLowerCase().includes(q));
 document.getElementById('count').textContent=`${images.length} / ${allImages.length}টি Image`;
 document.getElementById('list').innerHTML=images.map(x=>{const p=x.position||{};return `<div class="card"><div class="name">${esc(x.name)}</div><div class="${x.fileName?'ok':'miss'}">${x.fileName?'✅ Image saved: '+esc(x.fileName):'⚠️ Image upload করা হয়নি'}</div>${x.fileName?`<img class="preview" loading="lazy" alt="${esc(x.name)} preview" src="/api/pdf-images/${encodeURIComponent(x.id)}?raw=1">`:''}<div class="pos">${['x','y','w','h','z'].map(k=>`<label>${k.toUpperCase()}<br><input id="${k}-${x.id}" type="number" step="0.01" value="${Number(p[k]??(k==='z'?110:(k==='w'||k==='h'?100:0)))}"></label>`).join('')}<div><br><button class="save" onclick="savePos('${x.id}')">Save Position</button></div></div><input id="f-${x.id}" type="file" accept="image/png,image/jpeg,image/webp"><br><button class="replace" onclick="up('${x.id}','${encodeURIComponent(x.name)}')">${x.fileName?'Replace Image':'Upload Image'}</button>${x.fileName?`<button class="del" onclick="delImg('${x.id}')">Delete Image</button>`:''}</div>`}).join('')||'<div class="card">কোনো Image পাওয়া যায়নি।</div>';
}
async function load(){const d=await api('/api/pdf-images');allImages=d.images||[];render();}
async function savePos(id){const body={};for(const k of ['x','y','w','h','z'])body[k]=Number(document.getElementById(k+'-'+id).value);try{await api('/api/pdf-images/'+id+'/position',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});alert('Position permanent save হয়েছে')}catch(e){alert(e.message)}}
async function up(id,n){const f=document.getElementById('f-'+id).files[0];if(!f)return alert('Image select করুন');const rd=new FileReader();rd.onload=async()=>{try{await api('/api/pdf-images',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,name:decodeURIComponent(n),dataUrl:rd.result})});await load()}catch(e){alert(e.message)}};rd.readAsDataURL(f)}
async function delImg(id){if(!confirm('Image delete করবেন? Permanent office slot ও position থাকবে।'))return;try{await api('/api/pdf-images/'+id,{method:'DELETE'});await load()}catch(e){alert(e.message)}}
load();</script></body></html>
