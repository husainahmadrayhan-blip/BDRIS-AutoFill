services:
  - type: web
    name: bdris-autofill
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev && node render-build.cjs
    startCommand: npm start
    healthCheckPath: /ping
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: bdris-autofill-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true

databases:
  - name: bdris-autofill-db
    plan: free
    region: singapore
